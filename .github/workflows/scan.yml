name: Nightly insider scan
on:
  schedule:
    - cron: "30 3 * * 2-6"   # 03:30 UTC Tue-Sat = evening after the Mon-Fri US trading day
  workflow_dispatch:
    inputs:
      date:
        description: "Filing date YYYY-MM-DD (blank = yesterday)"
        required: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan.mjs ${{ github.event.inputs.date }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      - name: Commit results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Scan results" && git push)
