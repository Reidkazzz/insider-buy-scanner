name: Nightly insider scan
on:
  schedule:
    - cron: "30 3 * * 2-6"   # 03:30 UTC Tue-Sat = evening after the Mon-Fri US trading day
  workflow_dispatch:
    inputs:
      date:
        description: "Filing date YYYY-MM-DD (blank = yesterday)"
        required: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan.mjs ${{ github.event.inputs.date }}
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      - name: Commit results (safe against parallel runs)
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Scan results"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin main || git rebase --abort
            node -e 'const fs=require("fs");const d=fs.readdirSync("data").filter(f=>f.length===15&&f.endsWith(".json")).map(f=>f.slice(0,10)).sort().reverse();fs.writeFileSync("data/index.json",JSON.stringify(d))'
            git add data && (git diff --cached --quiet || git commit -m "Rebuild index")
            git push && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
